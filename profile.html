<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1 class="logo"><a href="index.html">MyShop</a></h1>
            <nav class="header-nav">
                <a href="index.html">🏠 Каталог</a>
                <a href="cart.html">🛒 Корзина</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <div id="notification-area"></div>

        <section class="profile-section">
            <h2>Заказы</h2>
            
            <table class="orders-table" id="orders-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Дата и время</th>
                        <th>Состав</th>
                        <th>Итоговая стоимость</th>
                        <th>Доставка</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="orders-list">
                    <!-- Сюда JS загрузит заказы -->
                    <tr><td colspan="6">Загрузка заказов...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2025 MyShop. Все права защищены.</p>
            <p>Контакты: example@myshop.ru</p>
        </div>
    </footer>

    <!-- Модальные окна -->
    <div id="modal-view" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header"><h3>Просмотр заказа</h3><span class="modal-close">&times;</span></div>
            <div id="view-content"></div>
            <div class="modal-actions"><button class="modal-btn modal-btn-ok" onclick="closeModal('modal-view')">Ок</button></div>
        </div>
    </div>

    <div id="modal-edit" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header"><h3>Редактирование заказа</h3><span class="modal-close">&times;</span></div>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <input type="text" id="edit-full_name" placeholder="Имя">
                <input type="email" id="edit-email" placeholder="Email">
                <input type="text" id="edit-phone" placeholder="Телефон">
                <input type="text" id="edit-delivery_address" placeholder="Адрес">
                <input type="date" id="edit-delivery_date">
                <select id="edit-delivery_interval">
                    <option value="08:00-12:00">08:00-12:00</option>
                    <option value="12:00-14:00">12:00-14:00</option>
                    <option value="14:00-18:00">14:00-18:00</option>
                    <option value="18:00-22:00">18:00-22:00</option>
                </select>
                <textarea id="edit-comment" placeholder="Комментарий"></textarea>
            </form>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal('modal-edit')">Отмена</button>
                <button class="modal-btn modal-btn-save" id="save-edit-btn">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="modal-delete" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header"><h3>Удаление заказа</h3><span class="modal-close">&times;</span></div>
            <p>Вы уверены, что хотите удалить заказ?</p>
            <input type="hidden" id="delete-id">
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal('modal-delete')">Нет</button>
                <button class="modal-btn modal-btn-delete" id="confirm-delete-btn">Да</button>
            </div>
        </div>
    </div>

    <script src="goods.js"></script>   
    <script src="profile.js"></script> 
</body>
</html>
