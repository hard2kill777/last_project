<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1 class="logo"><a href="index.html">MyShop</a></h1>
            <nav class="header-nav">
                <a href="index.html">🏠 Каталог</a>
                <a href="profile.html">👤 ЛК</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <div id="notification-area"></div>

        <section class="cart-section">
            <h2>Корзина</h2>
            
            <div id="cart-items" class="goods-grid">
                <!-- Сюда JS загрузит товары из корзины -->
            </div>

            <div id="empty-cart-message" style="display: none;">
                Корзина пуста. Перейдите в <a href="index.html">каталог</a>, чтобы добавить товары.
            </div>

            <div class="order-form-container" id="order-form-container">
                <h3>Оформление заказа</h3>
                <form id="order-form">
                    <input type="text" id="full_name" placeholder="Имя *" required>
                    <input type="email" id="email" placeholder="Email *" required>
                    <input type="text" id="phone" placeholder="Телефон *" required>
                    <label><input type="checkbox" id="subscribe"> Согласие на рассылку</label>
                    <input type="text" id="delivery_address" placeholder="Адрес доставки *" required>
                    <input type="date" id="delivery_date" required>
                    <select id="delivery_interval">
                        <option value="08:00-12:00">08:00 - 12:00</option>
                        <option value="12:00-14:00">12:00 - 14:00</option>
                        <option value="14:00-18:00">14:00 - 18:00</option>
                        <option value="18:00-22:00">18:00 - 22:00</option>
                    </select>
                    <textarea id="comment" placeholder="Комментарий к заказу"></textarea>
                    
                    <div class="order-total">
                        <span>Итоговая стоимость:</span>
                        <span id="total-cost">0 руб.</span>
                    </div>
                    <button type="submit" id="submit-order-btn">Оформить заказ</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2025 MyShop. Все права защищены.</p>
            <p>Контакты: example@myshop.ru</p>
        </div>
    </footer>

    <script src="goods.js"></script>
    <script src="cart.js"></script>
</body>
</html>
